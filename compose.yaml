name: filemorph
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: filemorph
      POSTGRES_PASSWORD: filemorph_local
      POSTGRES_DB: filemorph
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U filemorph']
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:56379:6379']
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30
  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: filemorph
      MINIO_ROOT_PASSWORD: filemorph_local_storage
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:59001:9001']
    volumes: ['storage:/data']
volumes:
  postgres:
  redis:
  storage:
